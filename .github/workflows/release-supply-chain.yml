name: Release supply chain

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  attest-api-worker-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Build API, worker, migrations and controlled access tool
        working-directory: services/core-api
        run: |
          mkdir -p ../../artifacts/release
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../artifacts/release/itemba-api ./cmd/api
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../artifacts/release/itemba-worker ./cmd/worker
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../artifacts/release/itemba-integration-worker ./cmd/integration-worker
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../artifacts/release/itemba-migrate ./cmd/migrate
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../artifacts/release/itemba-accessctl ./cmd/accessctl
      - name: Build Control Center
        working-directory: apps/control-center
        run: |
          npm ci
          npm run build
          tar -C .next/standalone -czf ../../artifacts/release/itemba-control-center.tar.gz .
      - name: Record artifact hashes
        run: sha256sum artifacts/release/* > artifacts/release/SHA256SUMS
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts/release
          format: spdx-json
          output-file: artifacts/release/itemba-z.spdx.json
          artifact-name: release-sbom-${{ github.run_id }}.spdx.json
          upload-artifact-retention: 90
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/release/*
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/release/itemba-api
            artifacts/release/itemba-worker
            artifacts/release/itemba-integration-worker
            artifacts/release/itemba-migrate
            artifacts/release/itemba-accessctl
            artifacts/release/itemba-control-center.tar.gz
          sbom-path: artifacts/release/itemba-z.spdx.json
      - name: Upload controlled release bundle
        uses: actions/upload-artifact@v4
        with:
          name: itemba-z-release-${{ github.run_number }}
          path: artifacts/release
          retention-days: 90
          if-no-files-found: error
