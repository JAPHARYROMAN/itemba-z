name: Recovery assurance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * 3"
  pull_request:
    paths:
      - ".github/workflows/recovery-assurance.yml"
      - "services/core-api/cmd/recoverymanifest/**"
      - "services/core-api/internal/platform/recovery/**"
      - "services/core-api/migrations/**"

permissions:
  contents: read

concurrency:
  group: recovery-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itemba_z_recovery_source
          POSTGRES_USER: itemba_z_recovery
          POSTGRES_PASSWORD: ci-only-recovery-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itemba_z_recovery -d itemba_z_recovery_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SOURCE_DATABASE_URL: postgres://itemba_z_recovery:ci-only-recovery-password@127.0.0.1:5432/itemba_z_recovery_source?sslmode=disable
      RESTORED_DATABASE_URL: postgres://itemba_z_recovery:ci-only-recovery-password@127.0.0.1:5432/itemba_z_recovery_restored?sslmode=disable
      SOURCE_RUNTIME_DATABASE_URL: postgres://itemba_z_recovery_api:ci-only-runtime-password@127.0.0.1:5432/itemba_z_recovery_source?sslmode=disable
      PGPASSWORD: ci-only-recovery-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build recovery tooling
        working-directory: services/core-api
        run: go build -trimpath -o "$RUNNER_TEMP/recoverymanifest" ./cmd/recoverymanifest
      - name: Create source recovery point
        working-directory: services/core-api
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
          ITEMBA_ENV: development
        run: |
          go run ./cmd/migrate
          ITEMBA_RUNTIME_USER=itemba_z_recovery_api ITEMBA_RUNTIME_PASSWORD=ci-only-runtime-password ITEMBA_RUNTIME_CAPABILITY=api go run ./cmd/devdbrole
          go run ./cmd/devseed
          go build -trimpath -o "$RUNNER_TEMP/recovery-api" ./cmd/api
      - name: Create posted and reversed golden-transaction evidence
        working-directory: services/core-api
        env:
          DATABASE_URL: ${{ env.SOURCE_RUNTIME_DATABASE_URL }}
          ITEMBA_ENV: development
          ITEMBA_HTTP_ADDRESS: 127.0.0.1:8080
          ITEMBA_METRICS_ADDRESS: 127.0.0.1:9090
        run: |
          "$RUNNER_TEMP/recovery-api" > "$RUNNER_TEMP/recovery-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recovery-api.pid"
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz > /dev/null; then
              break
            fi
            sleep 1
          done
          ITEMBA_API_BASE_URL=http://127.0.0.1:8080 node ../../scripts/verify-live-golden-sale.mjs
      - name: Stop source API before recovery point
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/recovery-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/recovery-api.pid")" || true
          fi
      - name: Capture source reconciliation manifest
        working-directory: services/core-api
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/recoverymanifest" > "$RUNNER_TEMP/source-manifest.json"
      - name: Capture encrypted-backup-shaped archive
        run: |
          docker run --rm --network host -e PGPASSWORD -v "$RUNNER_TEMP:/evidence" postgres:16-alpine pg_dump --host 127.0.0.1 --username itemba_z_recovery --dbname itemba_z_recovery_source --format custom --no-owner --no-acl --file /evidence/itemba-z-recovery.dump
          sha256sum "$RUNNER_TEMP/itemba-z-recovery.dump" > "$RUNNER_TEMP/backup-sha256.txt"
      - name: Restore into isolated database
        run: |
          docker run --rm --network host -e PGPASSWORD postgres:16-alpine psql --host 127.0.0.1 --username itemba_z_recovery --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE itemba_z_recovery_restored"
          docker run --rm --network host -e PGPASSWORD -v "$RUNNER_TEMP:/evidence" postgres:16-alpine pg_restore --host 127.0.0.1 --username itemba_z_recovery --dbname itemba_z_recovery_restored --no-owner --no-acl --exit-on-error /evidence/itemba-z-recovery.dump
      - name: Reconcile restored authoritative records
        working-directory: services/core-api
        env:
          DATABASE_URL: ${{ env.RESTORED_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/recoverymanifest" > "$RUNNER_TEMP/restored-manifest.json"
          diff --unified "$RUNNER_TEMP/source-manifest.json" "$RUNNER_TEMP/restored-manifest.json"
          go run ./cmd/migrate
          "$RUNNER_TEMP/recoverymanifest" > "$RUNNER_TEMP/forward-compatible-manifest.json"
          diff --unified "$RUNNER_TEMP/source-manifest.json" "$RUNNER_TEMP/forward-compatible-manifest.json"
      - name: Record recovery exercise evidence
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/recovery-exercise.json
          EXERCISE_ID: ${{ github.run_id }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/write-recovery-evidence.mjs
      - name: Retain recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovery-assurance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/backup-sha256.txt
            ${{ runner.temp }}/source-manifest.json
            ${{ runner.temp }}/restored-manifest.json
            ${{ runner.temp }}/forward-compatible-manifest.json
            ${{ runner.temp }}/recovery-exercise.json
          if-no-files-found: error
          retention-days: 90

  previous-binary-rollback-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itemba_z_rollback
          POSTGRES_USER: itemba_z_rollback
          POSTGRES_PASSWORD: ci-only-rollback-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itemba_z_rollback -d itemba_z_rollback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://itemba_z_rollback:ci-only-rollback-password@127.0.0.1:5432/itemba_z_rollback?sslmode=disable
      RUNTIME_DATABASE_URL: postgres://itemba_z_rollback_api:ci-only-runtime-password@127.0.0.1:5432/itemba_z_rollback?sslmode=disable
      ITEMBA_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: previous-release
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum
      - name: Apply candidate migrations and fixtures
        working-directory: services/core-api
        run: |
          go run ./cmd/migrate
          ITEMBA_RUNTIME_USER=itemba_z_rollback_api ITEMBA_RUNTIME_PASSWORD=ci-only-runtime-password ITEMBA_RUNTIME_CAPABILITY=api go run ./cmd/devdbrole
          go run ./cmd/devseed
      - name: Build previous release API
        working-directory: previous-release/services/core-api
        run: go build -trimpath -o "$RUNNER_TEMP/previous-api" ./cmd/api
      - name: Prove previous release starts against candidate schema
        env:
          DATABASE_URL: ${{ env.RUNTIME_DATABASE_URL }}
          ITEMBA_HTTP_ADDRESS: 127.0.0.1:8081
        run: |
          "$RUNNER_TEMP/previous-api" > "$RUNNER_TEMP/previous-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/previous-api.pid"
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/previous-api.log"
          exit 1
      - name: Retain rollback compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: previous-binary-compatibility-${{ github.run_id }}
          path: ${{ runner.temp }}/previous-api.log
          if-no-files-found: error
          retention-days: 90
      - name: Stop previous release API
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/previous-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/previous-api.pid")" || true
          fi
