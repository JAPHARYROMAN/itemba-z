name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint OpenAPI
        run: pnpm --package=@redocly/cli@2.9.0 dlx redocly lint contracts/openapi/itemba-z.v1.yaml
      - name: Validate event schema JSON
        run: node -e "JSON.parse(require('fs').readFileSync('contracts/events/event-envelope.v1.schema.json','utf8'))"
      - name: Validate Wave 2 security and privacy control evidence
        run: node scripts/validate-wave2-controls.mjs
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Validate local service topology
        env:
          POSTGRES_DB: itemba_z
          POSTGRES_USER: itemba_z
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_API_RUNTIME_USER: itemba_z_api_runtime
          POSTGRES_API_RUNTIME_PASSWORD: ci-only-api-runtime-password
          POSTGRES_WORKER_RUNTIME_USER: itemba_z_worker_runtime
          POSTGRES_WORKER_RUNTIME_PASSWORD: ci-only-worker-runtime-password
          MINIO_ROOT_USER: itemba_z_ci
          MINIO_ROOT_PASSWORD: ci-only-password
        run: docker compose -f infra/docker/compose.yaml config --quiet

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itemba_z_test
          POSTGRES_USER: itemba_z_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itemba_z_test -d itemba_z_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/core-api
    env:
      TEST_DATABASE_URL: postgres://itemba_z_test:ci-only-password@127.0.0.1:5432/itemba_z_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...
      - name: Build core API container
        run: docker build --tag itemba-z-core-api:ci .

  control-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci
      - name: Verify generated API types are current
        run: |
          npm run generate:api
          git diff --exit-code -- src/generated/itemba-z.v1.ts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Control Center container
        run: docker build --tag itemba-z-control-center:ci .

  golden-sale-http:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itemba_z_http
          POSTGRES_USER: itemba_z_http
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itemba_z_http -d itemba_z_http"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://itemba_z_http:ci-only-password@127.0.0.1:5432/itemba_z_http?sslmode=disable
      API_RUNTIME_DATABASE_URL: postgres://itemba_z_api_runtime:ci-only-api-runtime-password@127.0.0.1:5432/itemba_z_http?sslmode=disable
      WORKER_RUNTIME_DATABASE_URL: postgres://itemba_z_worker_runtime:ci-only-worker-runtime-password@127.0.0.1:5432/itemba_z_http?sslmode=disable
      ITEMBA_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply database migrations
        working-directory: services/core-api
        run: go run ./cmd/migrate
      - name: Provision restricted API database login
        working-directory: services/core-api
        env:
          ITEMBA_RUNTIME_USER: itemba_z_api_runtime
          ITEMBA_RUNTIME_PASSWORD: ci-only-api-runtime-password
          ITEMBA_RUNTIME_CAPABILITY: api
        run: go run ./cmd/devdbrole
      - name: Provision restricted worker database login
        working-directory: services/core-api
        env:
          ITEMBA_RUNTIME_USER: itemba_z_worker_runtime
          ITEMBA_RUNTIME_PASSWORD: ci-only-worker-runtime-password
          ITEMBA_RUNTIME_CAPABILITY: worker
        run: go run ./cmd/devdbrole
      - name: Install safe development fixtures
        working-directory: services/core-api
        run: go run ./cmd/devseed
      - name: Start live core API
        working-directory: services/core-api
        run: |
          go build -o "$RUNNER_TEMP/itemba-api" ./cmd/api
          DATABASE_URL="$API_RUNTIME_DATABASE_URL" "$RUNNER_TEMP/itemba-api" > "$RUNNER_TEMP/itemba-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/itemba-api.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/itemba-api.log"
          exit 1
      - name: Verify live golden-sale HTTP workflow
        env:
          ITEMBA_API_BASE_URL: http://127.0.0.1:8080
        run: node scripts/verify-live-golden-sale.mjs
      - name: Verify worker-only outbox runtime
        working-directory: services/core-api
        run: |
          go build -o "$RUNNER_TEMP/itemba-worker" ./cmd/worker
          set +e
          DATABASE_URL="$WORKER_RUNTIME_DATABASE_URL" ITEMBA_WORKER_ID=ci-smoke-worker \
            timeout --signal=TERM 5s "$RUNNER_TEMP/itemba-worker" > "$RUNNER_TEMP/itemba-worker.log" 2>&1
          status=$?
          set -e
          if test "$status" -ne 0 && test "$status" -ne 124; then
            cat "$RUNNER_TEMP/itemba-worker.log"
            exit "$status"
          fi
          grep -q 'published local outbox event' "$RUNNER_TEMP/itemba-worker.log"
      - name: Print API log on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/itemba-api.log"
          if test -f "$RUNNER_TEMP/itemba-worker.log"; then
            cat "$RUNNER_TEMP/itemba-worker.log"
          fi
      - name: Stop live core API
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/itemba-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/itemba-api.pid")" || true
          fi

  sales-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify generated Dart API contract is current
        run: dart run tool/generate_openapi_subset.dart --check
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  sales-mobile-release:
    if: startsWith(github.ref, 'refs/tags/mobile-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: apps/sales-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Require protected signing material
        env:
          ITEMBA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ITEMBA_ANDROID_KEYSTORE_BASE64 }}
          ITEMBA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ITEMBA_ANDROID_KEYSTORE_PASSWORD }}
          ITEMBA_ANDROID_KEY_ALIAS: ${{ secrets.ITEMBA_ANDROID_KEY_ALIAS }}
          ITEMBA_ANDROID_KEY_PASSWORD: ${{ secrets.ITEMBA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ITEMBA_ANDROID_KEYSTORE_BASE64"
          test -n "$ITEMBA_ANDROID_KEYSTORE_PASSWORD"
          test -n "$ITEMBA_ANDROID_KEY_ALIAS"
          test -n "$ITEMBA_ANDROID_KEY_PASSWORD"
          printf '%s' "$ITEMBA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/itemba-z-release.jks"
      - name: Build signed release APK and AAB
        env:
          ITEMBA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/itemba-z-release.jks
          ITEMBA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ITEMBA_ANDROID_KEYSTORE_PASSWORD }}
          ITEMBA_ANDROID_KEY_ALIAS: ${{ secrets.ITEMBA_ANDROID_KEY_ALIAS }}
          ITEMBA_ANDROID_KEY_PASSWORD: ${{ secrets.ITEMBA_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab > build/release-sha256.txt
      - name: Upload controlled distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itemba-z-sales-${{ github.run_number }}
          path: |
            apps/sales-mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/sales-mobile/build/app/outputs/bundle/release/app-release.aab
            apps/sales-mobile/build/release-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Generate Android release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: apps/sales-mobile/build/app/outputs
          format: spdx-json
          output-file: apps/sales-mobile/build/android-release.spdx.json
          artifact-name: android-release-sbom-${{ github.run_id }}.spdx.json
          upload-artifact-retention: 90
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/sales-mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/sales-mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Attest Android release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/sales-mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/sales-mobile/build/app/outputs/bundle/release/app-release.aab
          sbom-path: apps/sales-mobile/build/android-release.spdx.json
