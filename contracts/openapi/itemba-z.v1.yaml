        period_id: { type: string, format: uuid }
        action: { type: string, enum: [CLOSE, REOPEN] }
        reason: { type: string }
        requested_by: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        approved_by: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
    FiscalPeriodActionPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/FiscalPeriodActionRequest' } } }
    BankAccount:
      type: object
      additionalProperties: true
      required: [id, code, name, type, currency, gl_account_id, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [BANK, CASH, MOBILE_MONEY] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        gl_account_id: { type: string }
        active: { type: boolean }
    BankAccountPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/BankAccount' } } }
    ImportBankStatementLine:
      type: object
      additionalProperties: false
      required: [transaction_at, external_reference, description, amount_minor]
      properties:
        transaction_at: { type: string, format: date-time }
        external_reference: { type: string, maxLength: 120 }
        description: { type: string, minLength: 3, maxLength: 300 }
        amount_minor: { $ref: '#/components/schemas/SafeInteger' }
    ImportBankStatementCommand:
      type: object
      additionalProperties: false
      required: [account_id, external_reference, currency, period_start, period_end, opening_minor, closing_minor, lines]
      properties:
        account_id: { type: string, format: uuid }
        external_reference: { type: string, minLength: 3, maxLength: 120 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        opening_minor: { $ref: '#/components/schemas/SafeInteger' }
        closing_minor: { $ref: '#/components/schemas/SafeInteger' }
        lines: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/ImportBankStatementLine' } }
    BankLedgerCandidate:
      type: object
      required: [journal_line_id, journal_id, source_type, source_id, amount_minor, occurred_at, memo]
      properties:
        journal_line_id: { type: string }
        journal_id: { type: string, format: uuid }
        source_type: { type: string }
        source_id: { type: string, format: uuid }
        amount_minor: { $ref: '#/components/schemas/SafeInteger' }
        occurred_at: { type: string, format: date-time }
        memo: { type: string }
    BankStatementMatch:
      type: object
      required: [id, journal_line_id, actor_id, reason, occurred_at]
      properties:
        id: { type: string, format: uuid }
        journal_line_id: { type: string }
        actor_id: { type: string, format: uuid }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }
    BankStatementLine:
      allOf:
        - $ref: '#/components/schemas/ImportBankStatementLine'
        - type: object
          required: [id, candidates]
          properties:
            id: { type: string, format: uuid }
            match: { $ref: '#/components/schemas/BankStatementMatch' }
            candidates: { type: array, items: { $ref: '#/components/schemas/BankLedgerCandidate' } }
    BankStatement:
      type: object
      additionalProperties: true
      required: [id, account_id, external_reference, currency, period_start, period_end, opening_minor, closing_minor, status, imported_by, imported_at, correlation_id, lines]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        external_reference: { type: string }
        currency: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        opening_minor: { $ref: '#/components/schemas/SafeInteger' }
        closing_minor: { $ref: '#/components/schemas/SafeInteger' }
        status: { type: string, enum: [IMPORTED, RECONCILED] }
        imported_by: { type: string, format: uuid }
        imported_at: { type: string, format: date-time }
        reconciled_by: { type: string, format: uuid }
        reconciled_at: { type: string, format: date-time }
        correlation_id: { type: string, format: uuid }
        lines: { type: array, items: { $ref: '#/components/schemas/BankStatementLine' } }
    BankStatementPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BankStatement' } }
        next_cursor: { type: [string, 'null'] }
    MatchBankStatementLineCommand:
      type: object
      additionalProperties: false
      required: [journal_line_id, reason]
      properties:
        journal_line_id: { type: string, minLength: 1 }
        reason: { type: string, minLength: 8, maxLength: 500 }
    ReconcileBankStatementCommand:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 8, maxLength: 500 } }
    ReceiveCustomerCollectionCommand:
      type: object
      additionalProperties: false
      required: [invoice_sale_id, method, amount_minor, currency]
      properties:
        invoice_sale_id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount_minor: { $ref: '#/components/schemas/SafePositiveInteger' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CustomerCollection:
      type: object
      additionalProperties: true
      required: [id, customer_id, invoice_sale_id, method, account_id, amount_minor, currency, occurred_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        invoice_sale_id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        account_id: { type: string }
        amount_minor: { $ref: '#/components/schemas/SafePositiveInteger' }
        currency: { type: string }
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string, format: uuid }
    ReverseSaleCommand:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    MobileDeviceEnrollmentCommand:
      type: object
      additionalProperties: false
      required: [device_id, device_name, app_version]
      properties:
        device_id: { type: string, format: uuid }
        device_name: { type: string, minLength: 1, maxLength: 200 }
        app_version:
          type: string
          minLength: 1
          maxLength: 64
          description: Application build requesting enrollment. For an existing device, this becomes the acknowledged app version only with a successful cache-version acknowledgement.
        installed_master_data_version:
          allOf: [{ $ref: '#/components/schemas/SafePositiveInteger' }]
          description: Optional durable-cache acknowledgement; must be supplied with installed_price_version and equal the current available version to advance server state.
        installed_price_version:
          allOf: [{ $ref: '#/components/schemas/SafePositiveInteger' }]
          description: Optional durable-cache acknowledgement; must be supplied with installed_master_data_version and equal the current available version to advance server state.
        installed_catalog_snapshot_token:
          type: string
          format: uuid
          description: Optional immutable publication acknowledgement; required with both installed versions and must equal the current available token.
    MobileStockAllocation:
      type: object
      additionalProperties: false
      required: [product_id, allocated_quantity, remaining_quantity]
      properties:
        product_id: { type: string, format: uuid }
        allocated_quantity: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
        remaining_quantity: { $ref: '#/components/schemas/SafeInteger' }
    MobileDeviceEnrollment:
      type: object
      additionalProperties: false
      required: [device_id, status, actor_id, scope, device_name, app_version, master_data_version, price_version, catalog_snapshot_token, available_master_data_version, available_price_version, available_catalog_snapshot_token, timezone, offline_enabled, transaction_value_limit_minor, daily_value_limit_minor, remaining_daily_value_minor, offline_sales_valid_until, enrolled_at, last_seen_at, stock_allocations]
      properties:
        device_id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
        actor_id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/Scope' }
        device_name: { type: string }
        app_version:
          type: string
          minLength: 1
          maxLength: 64
          description: Application build bound to the acknowledged installed cache. It does not advance on an unacknowledged refresh.
        master_data_version:
          allOf: [{ $ref: '#/components/schemas/SafeNonNegativeInteger' }]
          description: Version durably installed and explicitly acknowledged by this device; zero means unacknowledged.
        price_version:
          allOf: [{ $ref: '#/components/schemas/SafeNonNegativeInteger' }]
          description: Price version durably installed and explicitly acknowledged by this device; zero means unacknowledged.
        catalog_snapshot_token:
          type: string
          format: uuid
          description: Snapshot durably installed by this device; the all-zero UUID means unacknowledged.
        available_master_data_version:
          allOf: [{ $ref: '#/components/schemas/SafePositiveInteger' }]
          description: Current legal-company master-data version available for download.
        available_price_version:
          allOf: [{ $ref: '#/components/schemas/SafePositiveInteger' }]
          description: Current legal-company price version available for download.
        available_catalog_snapshot_token:
          type: string
          format: uuid
          description: Current immutable legal-company catalog publication available for download.
        timezone: { type: string, example: Africa/Dar_es_Salaam }
        offline_enabled: { type: boolean }
        transaction_value_limit_minor: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
        daily_value_limit_minor: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
        remaining_daily_value_minor: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
        offline_sales_valid_until:
          type: string
          format: date-time
          description: Exclusive UTC deadline for creating offline sales with the acknowledged app and cache pair. It is immediately expired until a successful acknowledgement, lasts at most four hours, and never crosses the next configured tax-rule transition.
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        stock_allocations:
          type: array
          items: { $ref: '#/components/schemas/MobileStockAllocation' }
    MobileDevicePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MobileDeviceEnrollment' }
        next_cursor: { type: [string, 'null'] }
    ChangeMobileDeviceStatusCommand:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        reason: { type: string, minLength: 8, maxLength: 500 }
    ChangeMobileDeviceAllocationCommand:
      type: object
      additionalProperties: false
      required: [product_id, allocated_quantity, reason]
      properties:
        product_id: { type: string, format: uuid }
        allocated_quantity: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
        reason: { type: string, minLength: 8, maxLength: 500 }
    MobileSaleSyncCommand:
      type: object
      additionalProperties: false
      required: [customer_id, kind, lines, device_id, client_transaction_id, client_timestamp, app_version, master_data_version, price_version, catalog_snapshot_token, sync_attempt]
      properties:
        customer_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SaleKind' }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SaleLineCommand' }
        device_id: { type: string, format: uuid }
        client_transaction_id: { type: string, format: uuid }
        client_timestamp: { type: string, format: date-time }
        app_version: { type: string, minLength: 1, maxLength: 64 }
        master_data_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        price_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        catalog_snapshot_token: { type: string, format: uuid }
        sync_attempt: { type: integer, minimum: 1, maximum: 9007199254740991 }
        offline:
          type: boolean
          default: false
          description: Controlled offline mode accepts only physical CASH and zero-rated product lines. The client timestamp must fall inside a persisted server-issued lease bound to this exact device, app, master-data version, price version, and catalog snapshot token; nonzero effective tax or a changed governed product publication is rejected with 422.
    MobileSyncResult:
      type: object
      additionalProperties: false
      required: [client_transaction_id, state, receipt_reference, fiscal_status, idempotent_replay, sale]
      properties:
        client_transaction_id: { type: string, format: uuid }
        state: { type: string, enum: [synced] }
        receipt_reference:
          type: string
          description: Authoritative non-fiscal reference for the persisted sale.
        fiscal_status: { $ref: '#/components/schemas/FiscalStatus' }
        idempotent_replay:
          type: boolean
          description: True only when the server restored a previously committed result for this device and client transaction pair.
        sale: { $ref: '#/components/schemas/Sale' }
    MobileReconciliationStatus:
      type: string
      enum: [OPEN, RESOLVED]
    MobileReconciliationAction:
      type: string
      enum: [CASH_REFUNDED, POSTED_EXTERNALLY, DUPLICATE_CONFIRMED]
    MobileReconciliationResolution:
      type: object
      additionalProperties: false
      required: [id, case_id, action, reason, resolved_by, correlation_id, resolved_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/MobileReconciliationAction' }
        reason: { type: string, minLength: 8, maxLength: 500 }
        external_reference: { type: string, maxLength: 200 }
        resolved_by: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }
        resolved_at: { type: string, format: date-time }
    MobileReconciliationCase:
      type: object
      additionalProperties: false
      required: [id, scope, status, device_id, client_transaction_id, client_timestamp, app_version, master_data_version, price_version, catalog_snapshot_token, failure_code, command, created_by, correlation_id, created_at]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/Scope' }
        status: { $ref: '#/components/schemas/MobileReconciliationStatus' }
        device_id: { type: string, format: uuid }
        client_transaction_id: { type: string, format: uuid }
        client_timestamp: { type: string, format: date-time }
        app_version: { type: string, minLength: 1, maxLength: 64 }
        master_data_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        price_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        catalog_snapshot_token: { type: string, format: uuid }
        failure_code: { type: string, enum: [offline_reconciliation_required] }
        command:
          type: object
          additionalProperties: true
          description: Exact canonical mobile command retained as reconciliation evidence.
        created_by: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        resolution: { $ref: '#/components/schemas/MobileReconciliationResolution' }
    MobileReconciliationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MobileReconciliationCase' }
        next_cursor: { type: [string, 'null'] }
    ResolveMobileReconciliationCommand:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { $ref: '#/components/schemas/MobileReconciliationAction' }
        reason: { type: string, minLength: 8, maxLength: 500 }
        external_reference: { type: string, maxLength: 200 }
    Metric:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value: { $ref: '#/components/schemas/Money' }
        trend_percent: { type: [string, 'null'] }
    DashboardAlert:
      type: object
      required: [id, severity, title, source_type, source_id]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        source_type: { type: string }
        source_id: { type: string, format: uuid }
    Dashboard:
      type: object
      required: [as_of, metrics, alerts, pending_approvals]
      properties:
        as_of: { type: string, format: date-time }
        metrics: { type: array, items: { $ref: '#/components/schemas/Metric' } }
        alerts: { type: array, items: { $ref: '#/components/schemas/DashboardAlert' } }
        pending_approvals: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
    SafeInteger:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: JSON integer constrained to the JavaScript Number safe-integer range.
    SafeNonNegativeInteger:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Non-negative JSON integer constrained to the JavaScript Number safe-integer range.
    SafePositiveInteger:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: Positive JSON integer constrained to the JavaScript Number safe-integer range.
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        correlation_id: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
