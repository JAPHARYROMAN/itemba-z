        client_timestamp: { type: string, format: date-time }
        app_version: { type: string, minLength: 1, maxLength: 64 }
        master_data_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        price_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        catalog_snapshot_token: { type: string, format: uuid }
        sync_attempt: { type: integer, minimum: 1, maximum: 9007199254740991 }
        offline:
          type: boolean
          default: false
          description: Controlled offline mode accepts only physical CASH and zero-rated product lines. The client timestamp must fall inside a persisted server-issued lease bound to this exact device, app, master-data version, price version, and catalog snapshot token; nonzero effective tax or a changed governed product publication is rejected with 422.
    MobileSyncResult:
      type: object
      additionalProperties: false
      required: [client_transaction_id, state, receipt_reference, fiscal_status, idempotent_replay, sale]
      properties:
        client_transaction_id: { type: string, format: uuid }
        state: { type: string, enum: [synced] }
        receipt_reference:
          type: string
          description: Authoritative non-fiscal reference for the persisted sale.
        fiscal_status: { $ref: '#/components/schemas/FiscalStatus' }
        idempotent_replay:
          type: boolean
          description: True only when the server restored a previously committed result for this device and client transaction pair.
        sale: { $ref: '#/components/schemas/Sale' }
    MobileReconciliationStatus:
      type: string
      enum: [OPEN, RESOLVED]
    MobileReconciliationAction:
      type: string
      enum: [CASH_REFUNDED, POSTED_EXTERNALLY, DUPLICATE_CONFIRMED]
    MobileReconciliationResolution:
      type: object
      additionalProperties: false
      required: [id, case_id, action, reason, resolved_by, correlation_id, resolved_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/MobileReconciliationAction' }
        reason: { type: string, minLength: 8, maxLength: 500 }
        external_reference: { type: string, maxLength: 200 }
        resolved_by: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }
        resolved_at: { type: string, format: date-time }
    MobileReconciliationCase:
      type: object
      additionalProperties: false
      required: [id, scope, status, device_id, client_transaction_id, client_timestamp, app_version, master_data_version, price_version, catalog_snapshot_token, failure_code, command, created_by, correlation_id, created_at]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/Scope' }
        status: { $ref: '#/components/schemas/MobileReconciliationStatus' }
        device_id: { type: string, format: uuid }
        client_transaction_id: { type: string, format: uuid }
        client_timestamp: { type: string, format: date-time }
        app_version: { type: string, minLength: 1, maxLength: 64 }
        master_data_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        price_version: { $ref: '#/components/schemas/SafePositiveInteger' }
        catalog_snapshot_token: { type: string, format: uuid }
        failure_code: { type: string, enum: [offline_reconciliation_required] }
        command:
          type: object
          additionalProperties: true
          description: Exact canonical mobile command retained as reconciliation evidence.
        created_by: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        resolution: { $ref: '#/components/schemas/MobileReconciliationResolution' }
    MobileReconciliationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MobileReconciliationCase' }
        next_cursor: { type: [string, 'null'] }
    ResolveMobileReconciliationCommand:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { $ref: '#/components/schemas/MobileReconciliationAction' }
        reason: { type: string, minLength: 8, maxLength: 500 }
        external_reference: { type: string, maxLength: 200 }
    Metric:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value: { $ref: '#/components/schemas/Money' }
        trend_percent: { type: [string, 'null'] }
    DashboardAlert:
      type: object
      required: [id, severity, title, source_type, source_id]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        source_type: { type: string }
        source_id: { type: string, format: uuid }
    Dashboard:
      type: object
      required: [as_of, metrics, alerts, pending_approvals]
      properties:
        as_of: { type: string, format: date-time }
        metrics: { type: array, items: { $ref: '#/components/schemas/Metric' } }
        alerts: { type: array, items: { $ref: '#/components/schemas/DashboardAlert' } }
        pending_approvals: { $ref: '#/components/schemas/SafeNonNegativeInteger' }
    SafeInteger:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: JSON integer constrained to the JavaScript Number safe-integer range.
    SafeNonNegativeInteger:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Non-negative JSON integer constrained to the JavaScript Number safe-integer range.
    SafePositiveInteger:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: Positive JSON integer constrained to the JavaScript Number safe-integer range.
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        correlation_id: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
