openapi: 3.1.0
info:
  title: ITEMBA-Z Platform API
  version: 1.0.0
  description: >-
    Versioned contract for the ITEMBA-Z Control Center, Sales POS, and approved
    integrations. Posted-sale money uses integer minor units: exactly 100 stored
    minor units equal TZS 1. The current transactional slice and live bootstrap
    read models use whole-unit quantities. Every JSON integer is constrained to
    the JavaScript safe-integer range even though PostgreSQL retains bigint.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current deployment origin
security:
  - oidc: []
tags:
  - name: System
    description: Health and runtime state.
  - name: Context
    description: Authorized tenant and working scope.
  - name: Dashboard
    description: Governed management metrics and alerts.
  - name: Customers
    description: Company-scoped customer accounts and credit eligibility.
  - name: Products
    description: Authorized catalog, prices, and availability.
  - name: Sales
    description: Atomic sales, receipts, and linked reversals.
  - name: Mobile Sync
    description: Idempotent mobile transaction synchronization.
paths:
  /healthz:
    get:
      summary: Check process health
      operationId: getHealth
      tags: [System]
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
  /readyz:
    get:
      summary: Check process readiness
      operationId: getReadiness
      tags: [System]
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is ready to serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/context:
    get:
      summary: Get the caller's working context
      operationId: getWorkingContext
      tags: [Context]
      x-implementation-status: implemented
      responses:
        '200':
          description: Current authorized working context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/dashboard:
    get:
      summary: Get governed executive metrics
      operationId: getExecutiveDashboard
      tags: [Dashboard]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/LegalCompanyId'
        - $ref: '#/components/parameters/BranchId'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Governed metrics and alerts within authorized scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/customers:
    get:
      summary: List scoped customers
      operationId: listCustomers
      tags: [Customers]
      x-implementation-status: implemented
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: credit_eligible
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CatalogSnapshotToken'
      responses:
        '200':
          description: Customers visible in the caller's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/customers/{customer_id}/account:
    get:
      summary: Get a customer account, effective credit policy, and receivables ageing
      operationId: getCustomerAccount
      tags: [Customers]
      x-implementation-status: implemented
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authoritative customer account explanation as of the request time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAccountDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/customers/{customer_id}/credit-policies:
    post:
      summary: Schedule an append-only customer credit policy
      operationId: scheduleCustomerCreditPolicy
      tags: [Customers]
      x-implementation-status: implemented
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreditPolicyCommand' }
      responses:
        '201':
          description: Policy scheduled, or the original idempotent result returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/products:
    get:
      summary: List scoped products and availability
      operationId: listProducts
      tags: [Products]
      x-implementation-status: implemented
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CatalogSnapshotToken'
      responses:
        '200':
          description: Authorized products, prices, and available quantities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/customers/{customer_id}/collections:
    post:
      summary: Receive and allocate a customer collection
      operationId: receiveCustomerCollection
      tags: [Customers, Finance]
      x-implementation-status: implemented
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiveCustomerCollectionCommand' } } } }
      responses:
        '201': { description: Collection allocated and posted exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCollection' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/suppliers:
    get:
      summary: List active and inactive suppliers in company scope
      operationId: listSuppliers
      tags: [Purchases]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Scoped supplier master data., content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPage' } } } }
  /v1/operations/documents:
    get:
      summary: List scoped commercial and inventory documents
      operationId: listOperationDocuments
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OperationDocumentType' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Scoped immutable workflow documents., content: { application/json: { schema: { $ref: '#/components/schemas/OperationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a controlled workflow document draft
      operationId: createOperationDocument
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOperationCommand' } } } }
      responses:
        '201': { description: Draft created exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/OperationDocument' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/operations/documents/{document_id}:
    get:
      summary: Get a scoped workflow document
      operationId: getOperationDocument
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable workflow document., content: { application/json: { schema: { $ref: '#/components/schemas/OperationDocument' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/operations/documents/{document_id}/transitions:
    post:
      summary: Apply an authorized workflow transition and its atomic effects
      operationId: transitionOperationDocument
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransitionOperationCommand' } } } }
      responses:
        '200': { description: Transition committed exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/OperationDocument' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sales:
    post:
      summary: Complete and atomically post a sale
      operationId: completeSale
      tags: [Sales]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSaleCommand'
      responses:
        '201':
          description: Sale completed, or its idempotent original result returned, exactly once.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      summary: List scoped sales
      operationId: listSales
      tags: [Sales]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Sales visible in the caller's ownership and organization scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sales/{sale_id}:
    get:
      summary: Get an immutable posted sale
      operationId: getSale
      tags: [Sales]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: Immutable posted sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sales/{sale_id}/reversals:
    post:
      summary: Post a linked sale reversal
      operationId: reverseSale
      tags: [Sales]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/SaleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseSaleCommand'
      responses:
        '201':
          description: Linked reversal posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/mobile/sync/sales:
    post:
      summary: Synchronize a mobile sale idempotently
      description: >-
        Synchronizes cash sales from an enrolled device. CREDIT commands are
        rejected with 422 even while online until the mobile workflow carries
        an authoritative AR-aging and approval decision.
      operationId: syncMobileSale
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileSaleSyncCommand'
      responses:
        '200':
          description: Existing or newly completed sale result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/mobile/devices/enroll:
    post:
      summary: Enroll or refresh a POS device binding
      description: >-
        Binds the device to the authenticated actor and exact tenant, company,
        branch, and warehouse scope. Re-enrollment is idempotent only for that
        same binding and returns authoritative offline policy and allocations.
        The acknowledged app and installed version fields are advanced only
        when both optional installed-version acknowledgements equal the current
        available versions. A successful acknowledgement also issues a bounded,
        server-persisted offline-sales lease for that exact app and cache pair.
        A client must atomically install its cache before acknowledging it; a
        repeated acknowledgement is safe after a lost response.
      operationId: enrollMobileDevice
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileDeviceEnrollmentCommand'
      responses:
        '200':
          description: Current authoritative device binding and policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDeviceEnrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/mobile/devices:
    get:
      summary: List governed POS devices in the exact working scope
      operationId: listManagedMobileDevices
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Scoped device page with authoritative policy and remaining allocations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileDevicePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/mobile/devices/{device_id}/status-changes:
    post:
      summary: Suspend or reactivate a governed POS device
      description: Suspension immediately ends the device's current offline authorization. Reactivation requires a fresh device acknowledgement before offline sales can resume.
      operationId: changeManagedMobileDeviceStatus
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMobileDeviceStatusCommand' }
      responses:
        '200':
          description: Current authoritative device state after the recorded change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileDeviceEnrollment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/mobile/devices/{device_id}/allocation-changes:
    post:
      summary: Change one governed offline stock allocation
      description: The absolute allocation cannot fall below synchronized consumption or cause remaining device reservations to exceed live warehouse stock.
      operationId: changeManagedMobileDeviceAllocation
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMobileDeviceAllocationCommand' }
      responses:
        '200':
          description: Current authoritative device state and allocations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileDeviceEnrollment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/mobile/reconciliation-cases:
    get:
      summary: List governed offline-sale reconciliation cases
      description: Returns only cases in the caller's exact tenant, legal-company, branch, and warehouse scope.
      operationId: listMobileReconciliationCases
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MobileReconciliationStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Scoped reconciliation-case page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileReconciliationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/mobile/reconciliation-cases/{case_id}:
    get:
      summary: Read one governed offline-sale reconciliation case
      operationId: getMobileReconciliationCase
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/ReconciliationCaseId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reconciliation case and immutable evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileReconciliationCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mobile/reconciliation-cases/{case_id}/resolutions:
    post:
      summary: Append a controlled reconciliation resolution
      description: Records an immutable operator disposition only; it never posts accounting or stock implicitly.
      operationId: resolveMobileReconciliationCase
      tags: [Mobile Sync]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/ReconciliationCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveMobileReconciliationCommand' }
      responses:
        '201':
          description: Immutable resolution appended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileReconciliationCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.itemba-z.example/.well-known/openid-configuration
      description: >-
        Production tokens must contain UUID-valued user_id, tenant_id,
        company_id, branch_id, and warehouse_id claims. The standard sub claim
        remains identity-provider provenance and is not used as a database key.
  parameters:
    LegalCompanyId:
      name: legal_company_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    BranchId:
      name: branch_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CatalogSnapshotToken:
      name: snapshot_token
      in: query
      required: false
      description: >-
        Immutable token returned by the first catalog page. Supplying it on
        every subsequent customer and product page makes governed-data drift
        fail closed instead of mixing two publications.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    SaleId:
      name: sale_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReconciliationCaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Request syntax or parameters are invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Caller lacks permission or organization scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource is absent or not visible to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Current resource state conflicts with the command.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Business validation rejected the command.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [healthy] }
        version: { type: string }
    WorkingContext:
      type: object
      additionalProperties: false
