openapi: 3.1.0
info:
  title: ITEMBA-Z Platform API
  version: 1.0.0
  description: >-
    Versioned contract for the ITEMBA-Z Control Center, Sales POS, and approved
    integrations. Posted-sale money uses integer minor units: exactly 100 stored
    minor units equal TZS 1. The current transactional slice and live bootstrap
    read models use whole-unit quantities. Every JSON integer is constrained to
    the JavaScript safe-integer range even though PostgreSQL retains bigint.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current deployment origin
security:
  - oidc: []
tags:
  - name: System
    description: Health and runtime state.
  - name: Context
    description: Authorized tenant and working scope.
  - name: Dashboard
    description: Governed management metrics and alerts.
  - name: Customers
    description: Company-scoped customer accounts and credit eligibility.
  - name: Products
    description: Authorized catalog, prices, and availability.
  - name: Sales
    description: Atomic sales, receipts, and linked reversals.
  - name: Mobile Sync
    description: Idempotent mobile transaction synchronization.
  - name: Banking
    description: Cash and bank account statement reconciliation.
  - name: Finance
    description: Governed journals, transfers, adjustments, reversals, and fiscal-period control.
paths:
  /healthz:
    get:
      summary: Check process health
      operationId: getHealth
      tags: [System]
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
  /readyz:
    get:
      summary: Check process readiness
      operationId: getReadiness
      tags: [System]
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is ready to serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/context:
    get:
      summary: Get the caller's working context
      operationId: getWorkingContext
      tags: [Context]
      x-implementation-status: implemented
      responses:
        '200':
          description: Current authorized working context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/dashboard:
    get:
      summary: Get governed executive metrics
      operationId: getExecutiveDashboard
      tags: [Dashboard]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/LegalCompanyId'
        - $ref: '#/components/parameters/BranchId'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Governed metrics and alerts within authorized scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/customers:
    get:
      summary: List scoped customers
      operationId: listCustomers
      tags: [Customers]
      x-implementation-status: implemented
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: credit_eligible
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CatalogSnapshotToken'
      responses:
        '200':
          description: Customers visible in the caller's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/customers/{customer_id}/account:
    get:
      summary: Get a customer account, effective credit policy, and receivables ageing
      operationId: getCustomerAccount
      tags: [Customers]
      x-implementation-status: implemented
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authoritative customer account explanation as of the request time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAccountDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/customers/{customer_id}/credit-policies:
    post:
      summary: Schedule an append-only customer credit policy
      operationId: scheduleCustomerCreditPolicy
      tags: [Customers]
      x-implementation-status: implemented
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreditPolicyCommand' }
      responses:
        '201':
          description: Policy scheduled, or the original idempotent result returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/products:
    get:
      summary: List scoped products and availability
      operationId: listProducts
      tags: [Products]
      x-implementation-status: implemented
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CatalogSnapshotToken'
      responses:
        '200':
          description: Authorized products, prices, and available quantities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/customers/{customer_id}/collections:
    post:
      summary: Receive and allocate a customer collection
      operationId: receiveCustomerCollection
      tags: [Customers, Finance]
      x-implementation-status: implemented
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiveCustomerCollectionCommand' } } } }
      responses:
        '201': { description: Collection allocated and posted exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCollection' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/suppliers:
    get:
      summary: List active and inactive suppliers in company scope
      operationId: listSuppliers
      tags: [Purchases]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Scoped supplier master data., content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/operations/documents:
    get:
      summary: List scoped commercial and inventory documents
      operationId: listOperationDocuments
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OperationDocumentType' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Scoped immutable workflow documents., content: { application/json: { schema: { $ref: '#/components/schemas/OperationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a controlled workflow document draft
      operationId: createOperationDocument
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOperationCommand' } } } }
      responses:
        '201': { description: Draft created exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/OperationDocument' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/operations/documents/{document_id}:
    get:
      summary: Get a scoped workflow document
      operationId: getOperationDocument
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable workflow document., content: { application/json: { schema: { $ref: '#/components/schemas/OperationDocument' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/operations/documents/{document_id}/transitions:
    post:
      summary: Apply an authorized workflow transition and its atomic effects
      operationId: transitionOperationDocument
      tags: [Operations]
      x-implementation-status: implemented
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransitionOperationCommand' } } } }
      responses:
        '200': { description: Transition committed exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/OperationDocument' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/banking/accounts:
    get:
      summary: List scoped cash and bank accounts
      operationId: listBankAccounts
      tags: [Banking]
      x-implementation-status: implemented
      responses:
        '200': { description: Active and inactive accounts visible in the exact working scope., content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/banking/statements:
    get:
      summary: List scoped imported bank statements
      operationId: listBankStatements
      tags: [Banking]
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Imported and reconciled statements., content: { application/json: { schema: { $ref: '#/components/schemas/BankStatementPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Import an immutable balanced bank statement
      operationId: importBankStatement
      tags: [Banking]
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportBankStatementCommand' } } } }
      responses:
        '201': { description: Balanced statement imported exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/BankStatement' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/banking/statements/{statement_id}:
    get:
      summary: Get statement evidence and exact ledger candidates
      operationId: getBankStatement
      tags: [Banking]
      x-implementation-status: implemented
      parameters: [{ name: statement_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Statement lines, matches, and unused exact-value candidates.', content: { application/json: { schema: { $ref: '#/components/schemas/BankStatement' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/banking/statements/{statement_id}/lines/{line_id}/matches:
    post:
      summary: Match a statement line to one exact general-ledger cash entry
      operationId: matchBankStatementLine
      tags: [Banking]
      x-implementation-status: implemented
      parameters:
        - { name: statement_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: line_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MatchBankStatementLineCommand' } } } }
      responses:
        '201': { description: Append-only one-to-one match recorded., content: { application/json: { schema: { $ref: '#/components/schemas/BankStatement' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/banking/statements/{statement_id}/reconciliation:
    post:
      summary: Independently approve a fully matched reconciliation
      operationId: reconcileBankStatement
      tags: [Banking]
      x-implementation-status: implemented
      parameters:
        - { name: statement_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileBankStatementCommand' } } } }
      responses:
        '201': { description: Reconciliation approval recorded without mutating source evidence., content: { application/json: { schema: { $ref: '#/components/schemas/BankStatement' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/documents:
    get:
      summary: List governed financial documents
      operationId: listFinancialDocuments
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Scoped financial-document register., content: { application/json: { schema: { $ref: '#/components/schemas/FinancialDocumentPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a governed financial document
      operationId: createFinancialDocument
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateFinancialDocumentCommand' } } } }
      responses:
        '201': { description: Draft created exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/FinancialDocument' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/documents/{document_id}:
    get:
      summary: Get a governed financial document
      operationId: getFinancialDocument
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ name: document_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Financial document and immutable posting lines., content: { application/json: { schema: { $ref: '#/components/schemas/FinancialDocument' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/finance/documents/{document_id}/transitions:
    post:
      summary: Submit, reject, or independently post a financial document
      operationId: transitionFinancialDocument
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ name: document_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransitionFinancialDocumentCommand' } } } }
      responses:
        '201': { description: Transition and any balanced posting committed exactly once., content: { application/json: { schema: { $ref: '#/components/schemas/FinancialDocument' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/fiscal-periods:
    get:
      summary: List fiscal periods
      operationId: listFiscalPeriods
      tags: [Finance]
      x-implementation-status: implemented
      responses:
        '200': { description: Legal-company fiscal periods., content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/finance/fiscal-periods/{period_id}/actions:
    post:
      summary: Request fiscal-period close or reopen
      operationId: requestFiscalPeriodAction
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ name: period_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodActionCommand' } } } }
      responses:
        '201': { description: Close or reopen request recorded., content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodActionRequest' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/fiscal-period-actions/{action_id}/approval:
    post:
      summary: Independently approve fiscal-period close or reopen
      operationId: approveFiscalPeriodAction
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ name: action_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalReasonCommand' } } } }
      responses:
        '201': { description: Fiscal-period state changed after close gates and separation-of-duties checks., content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodActionRequest' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/fiscal-period-actions:
    get:
      summary: List fiscal-period close and reopen requests
      operationId: listFiscalPeriodActions
      tags: [Finance]
      x-implementation-status: implemented
      responses:
        '200': { description: Company fiscal action register including pending maker-checker work., content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodActionPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/finance/accounts:
    get:
      summary: List the governed legal-company chart of accounts
      operationId: listGLAccounts
      tags: [Finance]
      x-implementation-status: implemented
      responses:
        '200': { description: Chart of accounts including pending governance work., content: { application/json: { schema: { $ref: '#/components/schemas/GLAccountPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Submit a general-ledger account
      operationId: createGLAccount
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGLAccountCommand' } } } }
      responses:
        '201': { description: Account submitted for independent approval., content: { application/json: { schema: { $ref: '#/components/schemas/GLAccount' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/accounts/{account_id}/decisions:
    post:
      summary: Independently approve or reject a submitted account
      operationId: decideGLAccount
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ name: account_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceDecisionCommand' } } } }
      responses:
        '200': { description: Governance decision recorded., content: { application/json: { schema: { $ref: '#/components/schemas/GLAccount' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/posting-mappings:
    get:
      summary: List effective-dated posting mappings
      operationId: listPostingMappings
      tags: [Finance]
      x-implementation-status: implemented
      responses:
        '200': { description: Posting mapping register., content: { application/json: { schema: { $ref: '#/components/schemas/PostingMappingPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Submit an effective-dated posting mapping
      operationId: createPostingMapping
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePostingMappingCommand' } } } }
      responses:
        '201': { description: Mapping submitted for independent approval., content: { application/json: { schema: { $ref: '#/components/schemas/PostingMapping' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/finance/posting-mappings/{mapping_id}/decisions:
    post:
      summary: Independently approve or reject a posting mapping
      operationId: decidePostingMapping
      tags: [Finance]
      x-implementation-status: implemented
      parameters: [{ name: mapping_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceDecisionCommand' } } } }
      responses:
        '200': { description: Governance decision recorded., content: { application/json: { schema: { $ref: '#/components/schemas/PostingMapping' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/reports/financial/trial-balance:
    get:
      summary: Run the legal-company trial balance
      operationId: runTrialBalance
      tags: [Reports]
      x-implementation-status: implemented
      parameters: [{ name: as_of, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        '200': { description: Balanced account-level trial balance., content: { application/json: { schema: { $ref: '#/components/schemas/TrialBalance' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/financial/general-ledger:
    get:
      summary: Drill into one general-ledger account
      operationId: runGeneralLedger
      tags: [Reports]
      x-implementation-status: implemented
      parameters: [{ name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } }, { name: account_id, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: Chronological ledger with running balance and source drill-down., content: { application/json: { schema: { $ref: '#/components/schemas/GeneralLedger' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/financial/profit-and-loss:
    get:
      summary: Run the profit and loss statement
      operationId: runProfitAndLoss
      tags: [Reports]
      x-implementation-status: implemented
      parameters: [{ name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        '200': { description: 'Revenue, expenses, and net profit from the immutable ledger.', content: { application/json: { schema: { $ref: '#/components/schemas/ProfitAndLoss' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/financial/balance-sheet:
    get:
      summary: Run the balance sheet
      operationId: runBalanceSheet
      tags: [Reports]
      x-implementation-status: implemented
      parameters: [{ name: as_of, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        '200': { description: 'Assets, liabilities, equity, current earnings, and reconciliation status.', content: { application/json: { schema: { $ref: '#/components/schemas/BalanceSheet' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/financial/cash-flow:
    get:
      summary: Run the cash-flow statement
      operationId: runCashFlow
      tags: [Reports]
      x-implementation-status: implemented
