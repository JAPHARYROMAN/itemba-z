        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.itemba-z.example/.well-known/openid-configuration
      description: >-
        Production tokens must contain UUID-valued user_id, tenant_id,
        company_id, branch_id, and warehouse_id claims. The standard sub claim
        remains identity-provider provenance and is not used as a database key.
  parameters:
    LegalCompanyId:
      name: legal_company_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    BranchId:
      name: branch_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CatalogSnapshotToken:
      name: snapshot_token
      in: query
      required: false
      description: >-
        Immutable token returned by the first catalog page. Supplying it on
        every subsequent customer and product page makes governed-data drift
        fail closed instead of mixing two publications.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    SaleId:
      name: sale_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReconciliationCaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Request syntax or parameters are invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Caller lacks permission or organization scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource is absent or not visible to the caller.
