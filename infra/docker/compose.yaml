name: itemba-z-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  telemetry:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  migrate:
    profiles: [application]
    build:
      context: ../../services/core-api
    entrypoint: ["/app/migrate"]
    environment:
      ITEMBA_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ITEMBA_MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  dev-seed:
    profiles: [application]
    build:
      context: ../../services/core-api
    entrypoint: ["/app/devseed"]
    environment:
      ITEMBA_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  provision-api-runtime:
    profiles: [application]
    build:
      context: ../../services/core-api
    entrypoint: ["/app/devdbrole"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ITEMBA_RUNTIME_USER: ${POSTGRES_API_RUNTIME_USER:?Copy .env.example to .env}
      ITEMBA_RUNTIME_PASSWORD: ${POSTGRES_API_RUNTIME_PASSWORD:?Copy .env.example to .env}
      ITEMBA_RUNTIME_CAPABILITY: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  provision-worker-runtime:
    profiles: [application]
    build:
      context: ../../services/core-api
    entrypoint: ["/app/devdbrole"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ITEMBA_RUNTIME_USER: ${POSTGRES_WORKER_RUNTIME_USER:?Copy .env.example to .env}
      ITEMBA_RUNTIME_PASSWORD: ${POSTGRES_WORKER_RUNTIME_PASSWORD:?Copy .env.example to .env}
      ITEMBA_RUNTIME_CAPABILITY: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  core-api:
    profiles: [application]
    build:
      context: ../../services/core-api
    environment:
      ITEMBA_ENV: development
      ITEMBA_HTTP_ADDRESS: :8080
      ITEMBA_METRICS_ADDRESS: :9090
      DATABASE_URL: postgres://${POSTGRES_API_RUNTIME_USER}:${POSTGRES_API_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    expose:
      - "9090"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      dev-seed:
        condition: service_completed_successfully
      provision-api-runtime:
        condition: service_completed_successfully
    restart: unless-stopped

  outbox-worker:
    profiles: [application]
    build:
      context: ../../services/core-api
    entrypoint: ["/app/worker"]
    environment:
      ITEMBA_ENV: development
      ITEMBA_WORKER_ID: local-compose-worker
      DATABASE_URL: postgres://${POSTGRES_WORKER_RUNTIME_USER}:${POSTGRES_WORKER_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      dev-seed:
        condition: service_completed_successfully
      provision-worker-runtime:
        condition: service_completed_successfully
    restart: unless-stopped

  integration-worker:
    profiles: [application]
    build:
      context: ../../services/core-api
    entrypoint: ["/app/integration-worker"]
    environment:
      ITEMBA_INTEGRATION_WORKER_ID: local-compose-integration-worker
      DATABASE_URL: postgres://${POSTGRES_WORKER_RUNTIME_USER}:${POSTGRES_WORKER_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      dev-seed:
        condition: service_completed_successfully
      provision-worker-runtime:
        condition: service_completed_successfully
    restart: unless-stopped

  control-center:
    profiles: [application]
    build:
      context: ../../apps/control-center
    environment:
      ITEMBA_ENV: development
      ITEMBA_API_BASE_URL: http://core-api:8080
      ITEMBA_CONTROL_CENTER_ORIGIN: http://localhost:3000
      ITEMBA_DEV_IDENTITY_ENABLED: "true"
      ITEMBA_DEV_TENANT_ID: ${ITEMBA_DEV_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      ITEMBA_DEV_COMPANY_ID: ${ITEMBA_DEV_COMPANY_ID:-00000000-0000-4000-8000-000000000002}
      ITEMBA_DEV_BRANCH_ID: ${ITEMBA_DEV_BRANCH_ID:-00000000-0000-4000-8000-000000000003}
      ITEMBA_DEV_WAREHOUSE_ID: ${ITEMBA_DEV_WAREHOUSE_ID:-00000000-0000-4000-8000-000000000004}
      ITEMBA_DEV_ACTOR_ID: ${ITEMBA_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000005}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - core-api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
