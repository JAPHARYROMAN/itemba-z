# Production-shaped example. Provider modules must inject every ${env:...}
# value through workload identity or the approved secret manager.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: itemba-z-core-api
          scrape_interval: 15s
          scheme: http
          static_configs:
            - targets: ["${env:ITEMBA_CORE_API_METRICS_TARGET}"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement
        action: delete
      - key: enduser.id
        action: hash
  resource/platform:
    attributes:
      - key: service.namespace
        value: itemba-z
        action: upsert
      - key: deployment.environment.name
        value: ${env:ITEMBA_ENV}
        action: upsert
  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  otlphttp/managed:
    endpoint: ${env:ITEMBA_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:ITEMBA_OTLP_AUTHORIZATION}
    sending_queue:
      enabled: true
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    tls:
      insecure: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource/platform, batch]
      exporters: [otlphttp/managed]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource/platform, batch]
      exporters: [otlphttp/managed]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource/platform, batch]
      exporters: [otlphttp/managed]
